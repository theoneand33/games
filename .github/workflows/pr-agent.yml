name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request_target' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          config.model: "openrouter/deepseek/deepseek-v4.1-flash-1017"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "131072"
          config.ai_timeout: "600"
          # Prefer this OpenRouter endpoint (DeepInfra, fp8, flex tier); fall back if unavailable.
          OPENROUTER__PROVIDER_ORDER: '["deepinfra/fp8/flex"]'
          OPENROUTER__ALLOW_FALLBACKS: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
